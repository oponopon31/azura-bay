<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZURA BAY</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a1420; font-family: system-ui, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .hud-corner { position: absolute; }
  .hud-topleft { top: 12px; left: 12px; width: 300px; }
  .hud-topleft2 { top: 198px; left: 12px; width: 240px; }
  .hud-topright { top: 12px; right: 12px; text-align: right; }
  .hud-topcenter { top: 12px; left: 50%; transform: translateX(-50%); width: 420px; text-align: center; }
  .hud-bottomcenter { bottom: 14px; left: 50%; transform: translateX(-50%); width: 520px; display: flex; gap: 10px; align-items: center; background: rgba(5,10,18,.72); border-radius: 12px; padding: 10px 14px; }
  .hud-bottomright { bottom: 12px; right: 12px; text-align: right; }
  .hud-bottomright2 { bottom: 118px; right: 12px; text-align: right; }
  .bar { height: 10px; border-radius: 5px; background: rgba(0,0,0,.55); margin: 3px 0; overflow: hidden; position: relative; }
  .bar::before { content: ''; display: block; height: 100%; width: var(--v, 50%); border-radius: 5px; }
  .bar.health::before { background: #ff5d8f; }
  .bar.stamina::before { background: #b6ff4d; }
  .bar.focus::before { background: #b06bff; }
  .bar.oxygen::before { background: #4db8ff; }
  .bar span { position: absolute; left: 4px; top: -3px; font-size: 11px; }
  .badge { display: inline-block; background: #ffd34d; color: #111; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 8px; margin: 2px 2px 0 0; }
  .stars { font-size: 20px; letter-spacing: 2px; color: #ffd34d; text-shadow: 0 0 6px #000; }
  .clues { font-size: 11px; color: #ffb3c8; }
  .weapon, .money { font-size: 13px; text-shadow: 0 1px 2px #000; }
  .profile { font-size: 15px; font-weight: 700; text-shadow: 0 1px 2px #000; }
  .profile.breaking { color: #ff4d4d; }
  .relationship { font-size: 12px; color: #cfe8ff; text-shadow: 0 1px 2px #000; }
  .radio { font-size: 12px; color: #ffd34d; text-shadow: 0 1px 2px #000; }
  .hud-minimap { position: absolute; bottom: 12px; left: 12px; border-radius: 16px; overflow: hidden; box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
  .hud-minimap canvas { border-radius: 12px; display: block; }
  .dispatch-title { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #ffd34d; text-shadow: 0 1px 2px #000; margin-bottom: 4px; }
  .dispatch-row { display: flex; gap: 8px; font-size: 12px; text-shadow: 0 1px 2px #000; background: rgba(5,10,18,.55); border-radius: 6px; padding: 2px 6px; margin-bottom: 2px; }
  .dispatch-unit { flex: 1; }
  .dispatch-dist { color: #cfe8ff; }
  .dispatch-tactic { color: #ff8a5c; font-weight: 700; }
  .objective-title { font-size: 15px; font-weight: 700; color: #ffd34d; text-shadow: 0 1px 2px #000; }
  .objective-text { font-size: 13px; text-shadow: 0 1px 2px #000; }
  .objective-timer { font-size: 16px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000; }
  .dialogue-portrait { width: 44px; height: 44px; min-width: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #fff; text-shadow: 0 1px 2px #000; }
  .dialogue-speaker { font-size: 12px; font-weight: 700; color: #ffd34d; }
  .dialogue-line { font-size: 14px; }
  .speed { font-size: 34px; font-weight: 700; text-shadow: 0 1px 3px #000; }
  .speed span { font-size: 13px; font-weight: 400; }
  .speed-name { font-size: 12px; color: #cfe8ff; text-shadow: 0 1px 2px #000; }
  .fuel, .engine { font-size: 12px; text-shadow: 0 1px 2px #000; }
  #title-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(5,10,18,.72); z-index: 20; }
  #title-screen h1 { font-size: 64px; margin: 0; letter-spacing: 6px; color: #ffd34d; }
  #title-screen button { margin-top: 18px; font-size: 18px; padding: 10px 28px; border: none; border-radius: 8px; background: #ff4d9d; color: #fff; cursor: pointer; }
  #build-tag { position: fixed; bottom: 4px; right: 8px; font-size: 11px; color: rgba(255,255,255,.6); z-index: 30; }
  #pause { display: none; position: fixed; inset: 0; background: rgba(5,10,18,.8); z-index: 25; align-items: center; justify-content: center; flex-direction: column; }
  #pause h2 { margin: 0 0 10px; }
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<div id="title-screen">
  <h1 id="title">AZURA BAY</h1>
  <button id="play">PLAY</button>
</div>
<div id="pause"><h2>Paused</h2><p>AZURA BAY — press P to resume</p></div>
<span id="build-tag"></span>
<script type="module" src="./src/main.js"></script>
<script>
  document.getElementById('play').addEventListener('click', () => {
    document.getElementById('title-screen').style.display = 'none';
  });
  document.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'p') {
      const p = document.getElementById('pause');
      p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
    }
  });
</script>
</body>
</html>
