<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZURA BAY — GTA 6 Game (Round 7)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0e1a; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  #game { display: block; width: 100vw; height: 100vh; }
  #tag { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 12px; font-size: 12px; letter-spacing: 1px; z-index: 10; }
  #help { position: fixed; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 8px; font-size: 12px; line-height: 1.6; z-index: 10; }
  #help b { color: #ffcc00; }
</style>
</head>
<body>
<div id="tag">AZURA BAY · Round 7 — Leonida, 91 missions, 5 chapters</div>
<canvas id="game" width="1280" height="720"></canvas>
<div id="help">
  <b>WASD</b> move &nbsp; <b>E</b> interact &nbsp; <b>Tab</b> switch Jason/Lucia<br>
  <b>Phone</b> Up arrow &nbsp; <b>Radio</b> Q &nbsp; <b>Wanted</b> see top-right<br>
  <b>Cheats</b> unlock after finishing all 91 missions (phone, D-Pad Up + L1+R1)
</div>
<script type="module">
  import { boot } from "./src/main.js";
  boot("game");
</script>
</body>
</html>
